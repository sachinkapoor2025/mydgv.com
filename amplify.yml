version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # @astrojs/node standalone: static HTML/assets are in dist/client
    # (dist/server is for SSR compute; Amplify static hosting must serve client)
    baseDirectory: dist/client
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .astro/**/*
